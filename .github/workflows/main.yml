name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODEL_REPOS: "litert-community/Qwen2.5-0.5B-Instruct litert-community/Gemma3-270M-IT litert-community/SmolLM-135M-Instruct"
      MAX_BYTES: "420000000"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AppForge.zip -d src
      - name: Fixed keys
        run: |
          mkdir -p ~/.android src/app/build/gen-assets
          cp debug.keystore ~/.android/debug.keystore
          cp forge.p12 src/app/build/gen-assets/forge.p12
      - name: Download model
        run: |
          AUTH=()
          [ -n "$HF_TOKEN" ] && AUTH=(-H "Authorization: Bearer $HF_TOKEN")
          CHOSEN=""
          for REPO in $MODEL_REPOS; do
            echo "== $REPO"
            curl -sf "${AUTH[@]}" "https://huggingface.co/api/models/$REPO?blobs=true" > info.json || { echo "skip: cannot read repo"; continue; }
            jq -r '.siblings[] | select(.rfilename|endswith(".task")) | "\((.size // 0)/1000000|floor) MB  \(.rfilename)"' info.json
            FILE=$(jq -r --argjson max "$MAX_BYTES" '[.siblings[] | select(.rfilename|endswith(".task")) | select((.size // 0) > 0 and .size < $max)] | sort_by(.size) | last | .rfilename // empty' info.json)
            if [ -z "$FILE" ]; then echo "skip: no file under limit"; continue; fi
            if curl -fL --retry 3 "${AUTH[@]}" -o src/app/build/gen-assets/model.task "https://huggingface.co/$REPO/resolve/main/$FILE"; then
              CHOSEN="$REPO"; echo "chosen: $REPO / $FILE"; break
            else
              echo "skip: download failed (maybe needs license and HF_TOKEN)"
            fi
          done
          if [ -z "$CHOSEN" ]; then echo "ERROR: no suitable model found"; exit 1; fi
          echo "$CHOSEN" > src/app/build/gen-assets/model_name.txt
          cd src/app/build/gen-assets
          split -b 200M -d -a 2 --additional-suffix=.task model.task model_
          rm model.task
          ls -lh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: src
        run: |
          gradle :app:assembleDebug --console=plain > build.log 2>&1 || { grep -B2 -A14 -E "What went wrong|error:" build.log | head -80; exit 1; }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk AppForge-0.2.5-v${{ github.run_number }}.apk
          ls -lh AppForge-0.2.5-v${{ github.run_number }}.apk
          gh release create v${{ github.run_number }} AppForge-0.2.5-v${{ github.run_number }}.apk --title "v${{ github.run_number }} (0.2.5)" --notes "גרסה 0.2.5, בנייה ${{ github.run_number }}"
