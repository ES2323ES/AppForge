name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODEL_REPO: litert-community/Qwen2.5-1.5B-Instruct
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AppForge.zip -d src
      - name: Fixed keys
        run: |
          mkdir -p ~/.android src/app/build/gen-assets
          cp debug.keystore ~/.android/debug.keystore
          cp forge.p12 src/app/build/gen-assets/forge.p12
      - name: Download model
        run: |
          AUTH=()
          [ -n "$HF_TOKEN" ] && AUTH=(-H "Authorization: Bearer $HF_TOKEN")
          FILE=$(curl -sf "${AUTH[@]}" "https://huggingface.co/api/models/$MODEL_REPO" | jq -r '[.siblings[].rfilename | select(endswith(".task"))] | (map(select(contains("4096"))) + .) | .[0]')
          echo "model file: $FILE"
          if [ -z "$FILE" ] || [ "$FILE" = "null" ]; then echo "ERROR: no .task file found in $MODEL_REPO"; exit 1; fi
          curl -fL --retry 3 "${AUTH[@]}" -o src/app/build/gen-assets/model.task "https://huggingface.co/$MODEL_REPO/resolve/main/$FILE"
          echo "$MODEL_REPO" > src/app/build/gen-assets/model_name.txt
          cd src/app/build/gen-assets
          split -b 200M -d -a 2 --additional-suffix=.task model.task model_
          rm model.task
          ls -lh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: src
        run: |
          gradle :app:assembleDebug --console=plain > build.log 2>&1 || { grep -B2 -A14 -E "What went wrong|error:" build.log | head -80; exit 1; }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk AppForge-0.2.2-v${{ github.run_number }}.apk
          ls -lh AppForge-0.2.2-v${{ github.run_number }}.apk
          gh release create v${{ github.run_number }} AppForge-0.2.2-v${{ github.run_number }}.apk --title "v${{ github.run_number }} (0.2.2)" --notes "גרסה 0.2.2, בנייה ${{ github.run_number }}"
