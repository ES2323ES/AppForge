name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AppForge.zip -d src
      - name: Fixed keys
        run: |
          mkdir -p ~/.android src/app/build/gen-assets
          cp debug.keystore ~/.android/debug.keystore
          cp forge.p12 src/app/build/gen-assets/forge.p12
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: src
        run: |
          gradle :app:assembleDebug --console=plain > build.log 2>&1 || { grep -B2 -A14 -E "What went wrong|error:" build.log | head -80; exit 1; }
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk AppForge-v${{ github.run_number }}.apk
          gh release create v${{ github.run_number }} AppForge-v${{ github.run_number }}.apk --title "v${{ github.run_number }}" --notes "גרסה ${{ github.run_number }}"
