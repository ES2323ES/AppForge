name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q AppForge.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: src
        run: |
          gradle :app:assembleDebug --console=plain > build.log 2>&1 || { grep -B2 -A14 -E "What went wrong|error:" build.log | head -80; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: AppForge-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk
